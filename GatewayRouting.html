<body>
<div class="wrap" id="app"></div>
<div id="ovl"><button id="cl" aria-label="Tutup" onclick="closeAnim()"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg></button>
<div class="cap" id="t"></div><div class="cap" id="b"></div><svg id="asv" viewBox="0 0 840 392" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Penjelasan topologi"></svg>

<div id="rot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18.5h2"/></svg>
<div style="font-size:1.25rem;font-weight:800">Putar HP ke mode landscape</div><div class="sm" style="opacity:.85">Aplikasi ini lebih nyaman dipakai dengan layar mendatar.</div>
<button id="rotb">Layar penuh &amp; landscape</button><a id="rots">Lanjutkan tanpa memutar</a></div>
<script>
const $=i=>document.getElementById(i),sl=ms=>new Promise(r=>setTimeout(r,ms)),rn=n=>Math.floor(Math.random()*n);
const ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
const A=(a,b,c,d)=>((a*256+b)*256+c)*256+d;
const BAD=[[A(0,0,0,0),8],[A(127,0,0,0),8],[A(169,254,0,0),16],[A(100,64,0,0),10],[A(192,0,0,0),24],[A(192,0,2,0),24],[A(198,18,0,0),15],[A(198,51,100,0),24],[A(203,0,113,0),24],[A(224,0,0,0),3]];
function rnet(p){const s=2**(32-p);for(;;){let b=(1+rn(223))*16777216+rn(16777216);b-=b%s;if(!BAD.some(([c,q])=>b<c+2**(32-q)&&c<b+s))return{b,p,s}}}
const cidr=n=>ip(n.b)+'/'+n.p;
const TCH=matchMedia('(pointer:coarse)').matches;let rotSkip=false;
async function goFS(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch(e){}
  try{await screen.orientation.lock('landscape')}catch(e){}chkRot()}
function chkRot(){$('rot').classList.toggle('on',!rotSkip&&TCH&&innerWidth<=700&&innerHeight>innerWidth)}
if(TCH){addEventListener('click',()=>goFS(),{once:true});addEventListener('resize',chkRot);addEventListener('orientationchange',chkRot);
  $('rotb').onclick=e=>{e.stopPropagation();goFS()};$('rots').onclick=e=>{e.stopPropagation();rotSkip=true;chkRot()};chkRot()}
function gen(){
  let N;for(;;){N=[0,0,0].map(()=>[27,28,29][rn(3)]).concat([30,30,24]).map(rnet);if(N.every((x,i)=>N.every((y,j)=>i==j||!(x.b<y.b+y.s&&y.b<x.b+x.s))))break}
  const pick=(n,ex=[])=>{let h;do h=n.b+1+rn(n.s-2);while(ex.includes(h));return h};
  const rooms=[0,1,2].map(i=>{const n=N[i],r=n.b+2+rn(n.s-3),h=[];while(h.length<3){const x=pick(n,[r,...h]);h.push(x)}return{n,r,h:h.sort((a,b)=>a-b)}});
  const lk=[N[5],N[3],N[4]].map((n,i)=>{let a,b;if(i==0){a=pick(n);b=pick(n,[a])}else{a=n.b+1;b=n.b+2;if(rn(2))[a,b]=[b,a]}return{n,l:a,r:b}});
  const sh=()=>[1,2,3].sort(()=>Math.random()-.5);
  const R=[0,1,2].map(i=>{const e=sh();return{name:'ABC'[i],L:e[0],R:e[1],B:e[2]}});
  const s=rn(3),cands=[0,1,2].filter(j=>j!=s).map(j=>({room:j,pos:j+1})).concat([{room:null,pos:0}]),d=cands[rn(cands.length)];
  const dir=d.pos<s+1?-1:1,li=dir<0?s:s+1;
  const nbEth=dir<0?(s==0?null:R[s-1].R):R[s+1].L;
  const nbName=dir<0?(s==0?'ISP':'Router '+R[s-1].name):'Router '+R[s+1].name;
  return{N,rooms,lk,R,s,d,dir,li,gw:dir<0?lk[s].l:lk[s+1].r,ourIp:dir<0?lk[s].r:lk[s+1].l,ourEth:dir<0?R[s].L:R[s].R,

   <p><span class="chip"><b>Nama:</b> ${esc(S.nama)}</span><span class="chip"><b>Kelas:</b> ${esc(S.kelas)}</span><span class="chip"><b>Waktu:</b> ${fmt(dur)}</span><span class="chip">${new Date().toLocaleString('id-ID')}</span></p>
   <div class="row" style="align-items:flex-end"><div><div class="big">${nilai}</div><div class="mut">nilai</div></div><div style="margin-left:18px"><b>${sc}</b> benar dari ${tot} soal</div></div></div>
  <div class="card"><h2>Rincian jawaban</h2><table><tr><th>No</th><th>Soal</th><th>Dst-Address</th><th>Gateway</th></tr>${rows}</table></div>
  <div class="row noprint"><button class="p" onclick="window.print()">Cetak atau simpan PDF</button><button onclick="home()">Kembali ke menu</button></div></div>`;
}
/* geser topologi (drag kiri-kanan) */
(()=>{let d=null,raf=0;
 const stop=()=>{cancelAnimationFrame(raf);raf=0};
 const end=e=>{if(!d||(e&&e.pointerId!==d.id))return;const t=d.t;t.classList.remove('drag');let v=d.v;d=null;
  if(Math.abs(v)<.15)return;const step=()=>{t.scrollLeft-=v*16;v*=.92;if(Math.abs(v)>.02)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)};
 document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('.topo');stop();
  if(!t||t.scrollWidth<=t.clientWidth+1||(e.pointerType==='mouse'&&e.button!==0))return;
  d={t,id:e.pointerId,x:e.clientX,l:t.scrollLeft,lx:e.clientX,lt:performance.now(),v:0,cap:0}});
 document.addEventListener('pointermove',e=>{if(!d||e.pointerId!==d.id)return;const dx=e.clientX-d.x;
  if(!d.cap){if(Math.abs(dx)<4)return;d.cap=1;d.t.classList.add('drag');try{d.t.setPointerCapture(e.pointerId)}catch(_){}}
  d.t.scrollLeft=d.l-dx;const n=performance.now(),dt=n-d.lt;if(dt>0){d.v=.8*d.v+.2*((e.clientX-d.lx)/dt);d.lx=e.clientX;d.lt=n}});
 document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
})();
home();
</script></body></html>
